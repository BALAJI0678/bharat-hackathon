name: Run Bharat Evidence Agent
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  synthetic-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Execute synthetic agent
        run: python run_demo.py
      - name: Show execution in job summary
        run: cat outputs/execution.md >> "$GITHUB_STEP_SUMMARY"
      - name: Save review packet and trace
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-agent-results
          path: outputs/
          retention-days: 7
